name: VM Deploy OpenCode

on:
  push:
    branches:
      - main
  workflow_dispatch:
    
concurrency:
  group: ${{ github.workflow }}
  # Never cancel a deploy in flight: the script runs `docker compose down` and a
  # cancellation between that and `up -d` leaves the site offline. Queued runs
  # are fine — the newest commit deploys when the current one finishes.
  cancel-in-progress: false

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_ADMIN }}
          password: ${{ secrets.ADMIN_PASSWORD }}
          script: | 
            cd ${{ secrets.REPO_NAME }}
            git pull origin main
            docker compose down
            docker compose up -d
